
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per la mia Ele ❤️</title>
    <style>
        /* Reset e centratura assoluta del corpo */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); 
            font-family: 'Arial', sans-serif; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        /* Contenitore centrato con bordo (margine) attorno */
        #main-container { 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; background: rgba(255, 255, 255, 0.4); 
            padding: 40px; border-radius: 40px; backdrop-filter: blur(15px); 
            width: 80%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h1 { color: white; font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin: 0 0 20px 0; }
        
        #img-cont { width: 200px; height: 200px; clip-path: url("#heart-mask"); background: white; margin-bottom: 20px; }
        #img-cont img { width: 100%; height: 100%; object-fit: cover; }
        
        button { padding: 15px 30px; font-size: 1.2rem; background: #ff4d6d; color: white; border: none; border-radius: 50px; cursor: pointer; }
        
        /* Overlay centrato */
        #message-box { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); color: white; 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; padding: 20px; text-align: center;
        }
        
        .falling-heart { position: absolute; font-size: 25px; z-index: 1; pointer-events: none; }
        #dedica { font-size: 1.5rem; margin-bottom: 20px; max-width: 80%; line-height: 1.4; }
        
        /* Il bottone scappa ma resta nel flusso o riappare centrato se necessario */
        #btn-scappa { transition: all 0.2s; }
    </style>
</head>
