<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per la mia Ele ❤️</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle, #ff9a9e 0%, #fad0c4 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none; user-select: none;
        }

        #main-container {
            text-align: center; z-index: 10;
            background: rgba(255, 255, 255, 0.4);
            /* Dimensioni massive ma con margine massimo per non coprire gli angoli */
            width: 90vw; height: 90vh;
            max-width: 600px; max-height: 800px;
            padding: 20px; border-radius: 40px;
            backdrop-filter: blur(15px); border: 2px solid rgba(255,255,255,0.5);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-sizing: border-box; /* Importante per padding */
        }

        h1 {
            color: white; font-size: 2.8rem; margin: 0 0 15px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            line-height: 1.1;
        }

        #img-cont {
            position: relative;
            /* La dimensione dell'immagine si basa proporzionalmente al contenitore */
            width: 100%; height: auto;
            flex-grow: 1; /* Prende lo spazio disponibile */
            max-height: 60%; /* Massimo il 60% dell'altezza del contenitore */
            margin: 15px 0;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #img-cont img {
            width: 100%; height: 100%;
            object-fit: contain; /* L'immagine si adatta SENZA ritagli */
            opacity: 0; /* Nascondiamo finché non è caricata per applicare la clip */
            transition: opacity 0.3s;
        }

        #img-cont.loaded img {
            opacity: 1;
        }

        button {
            padding: 15px 30px; font-size: 1.4rem; background: #ff4d6d; color: white;
            border: none; border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s;
            margin-top: 15px;
        }
        button:hover { transform: scale(1.05); }

        #message-box {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 105, 180, 0.9); color: white; justify-content: center;
            align-items: center; text-align: center; padding: 20px; z-index: 100;
        }

        #btn-scappa { position: relative; cursor: crosshair; }

        .exploding-heart { position: absolute; font-size: 25px; pointer-events: none; }
    </style>
</head>
<body>

    <svg width="0" height="0">
        <defs>
            <clipPath id="heart-mask">
                <path d="M500 830C220 580 0 400 0 250C0 110 110 0 250 0C330 0 410 40 460 100C510 40 590 0 670 0C810 0 920 110 920 250C920 400 700 580 420 830"
                      transform="scale(0.001, 0.001)"/>
            </clipPath>
        </defs>
    </svg>

    <div id="main-container">
        <h1>Ti amo tanto ele!!</h1>
        <div id="img-cont">
            <img src="hellokitty.jpg" id="photo" alt="Hello Kitty e Kuromi">
        </div>
        <button onclick="openMsg()">Cliccami tesoro</button>
    </div>

    <div id="message-box">
        <p id="dedica" style="font-size: 1.8rem;">Ti amo tantissimo, sei unica per me... ma questo probabilmente l'hai già capito dalla lettera!</p>
        <button onclick="closeMsg()">Chiudi</button>
        <button id="btn-scappa" onmouseenter="moveBtn()" ontouchstart="moveBtn()">Ti amo di più</button>
    </div>

    <script>
        // Adattamento automatico del cuore alla foto
        const imgCont = document.getElementById('img-cont');
        const photo = document.getElementById('photo');

        photo.addEventListener('load', () => {
            const width = photo.naturalWidth;
            const height = photo.naturalHeight;

            // Applichiamo la clip path solo dopo il caricamento
            photo.style.clipPath = 'url(#heart-mask)';
            imgCont.classList.add('loaded'); // Mostriamo l'immagine
        });

        // Gestione messaggi
        function openMsg() {
            document.getElementById('message-box').style.display = 'flex';
            for(let i=0; i<30; i++) createExplosionHeart();
        }

        function closeMsg() { document.getElementById('message-box').style.display = 'none'; }

        // Pulsante sfuggente
        function moveBtn() {
            const b = document.getElementById('btn-scappa');
            b.style.position = 'fixed';
            b.style.left = Math.random() * 60 + 20 + 'vw';
            b.style.top = Math.random() * 60 + 20 + 'vh';
        }

        // Esplosione cuori
        function createExplosionHeart() {
            const h = document.createElement('div');
            h.innerHTML = '❤️'; h.className = 'exploding-heart';
            h.style.left = '50vw'; h.style.top = '50vh';
            document.body.appendChild(h);
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 15 + 8;
            let x = 0, y = 0;
            const animate = () => {
                x += Math.cos(angle) * velocity;
                y += Math.sin(angle) * velocity;
                h.style.transform = `translate(${x}px, ${y}px)`;
                if(Math.abs(x) < 500 && Math.abs(y) < 500) requestAnimationFrame(animate);
                else h.remove();
            };
            animate();
        }
    </script>
</body>
</html>
